
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #b2cefa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            width: 300px;
            background: #222831;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px #0003;
        }

        #display {
            width: 100%;
            height: 65px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background: #eeeeee;
            color: #222831;
            font-size: 28px;
            text-align: right;
            padding: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            background: #393e46;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .operator {
            background: #ff9f43;
            color: black;
        }

        .clear {
            background: #e74c3c;
        }

        .equal {
            background: #00b894;
            color: white;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="percent()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>

    </div>

    <script>
        const display = document.getElementById("display");

        let current = "0";
        let previous = null;
        let operator = null;
        let reset = false;

        function updateDisplay() {
            display.value = current;
        }

        function appendNumber(number) {
            if (reset) {
                current = number === "." ? "0." : number;
                reset = false;
            } else if (number === ".") {
                if (current.includes(".")) return;
                current += ".";
            } else {
                current = current === "0" ? number : current + number;
            }

            updateDisplay();
        }

        function chooseOperator(op) {
            if (operator && !reset) {
                calculate();
            }

            previous = Number(current);
            operator = op;
            reset = true;
        }

        function calculate() {
            if (operator === null || previous === null) return;

            let a = previous;
            let b = Number(current);
            let result;

            switch (operator) {
                case "+":
                    result = a + b;
                    break;
                case "-":
                    result = a - b;
                    break;
                case "*":
                    result = a * b;
                    break;
                case "/":
                    if (b === 0) {
                        current = "Cannot divide by zero";
                        previous = null;
                        operator = null;
                        reset = true;
                        updateDisplay();
                        return;
                    }
                    result = a / b;
                    break;
            }

            current = String(Number(result.toPrecision(12)));
            previous = null;
            operator = null;
            reset = true;
            updateDisplay();
        }

        function clearDisplay() {
            current = "0";
            previous = null;
            operator = null;
            reset = false;
            updateDisplay();
        }

        function deleteLast() {
            if (reset) return;

            current = current.length > 1
                ? current.slice(0, -1)
                : "0";

            updateDisplay();
        }

        function percent() {
            current = String(Number(current) / 100);
            updateDisplay();
        }
    </script>

</body>
</html>
